<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 438" role="img" aria-labelledby="t d" font-family="'DM Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif">
  <title id="t">Business rejection and system failure are not the same non-zero result</title>
  <desc id="d">A rejected record continues the batch with exit code 0. A file operation failure stops the batch, makes the result untrustworthy and returns 1. EOF and an empty file are normal ends.</desc>
  <style>
    .h1{font-size:16px;font-weight:600;fill:#3f3b3b}.sub{font-size:12px;fill:#5f5b52}
    .box{font-size:11.5px;font-weight:600;fill:#3f3b3b}.mono{font-size:10.5px;fill:#3f3b3b;font-family:'DM Mono',ui-monospace,monospace}
    .note{font-size:11px;fill:#5f5b52}.rc{font-size:12px;font-weight:600;fill:#76319f;font-family:'DM Mono',ui-monospace,monospace}
  </style>
  <rect x="1" y="1" width="898" height="436" rx="10" fill="#fcfbf7" stroke="#d8d2c3"/>
  <text class="h1" x="28" y="34">Same non-zero, different origin</text>
  <text class="sub" x="28" y="54">Decide first what kind of failure this is; only one of them fails the batch.</text>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker></defs>

  <rect x="330" y="76" width="240" height="46" rx="3" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.5"/>
  <text class="box" x="344" y="104">what happened on this record?</text>

  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M400 124 V160 H200 V184"/>
    <path d="M500 124 V160 H700 V184"/>
  </g>

  <!-- business rejection -->
  <rect x="60" y="188" width="280" height="96" rx="3" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.5"/>
  <text class="box" x="74" y="210">business rejection</text>
  <text class="mono" x="74" y="228">bad type, bad amount, failed rule</text>
  <text class="mono" x="74" y="245">→ rejected.txt + reason</text>
  <text class="mono" x="74" y="262">batch continues, later records process</text>
  <text class="rc" x="74" y="278">exit code still 0</text>

  <!-- system failure -->
  <rect x="560" y="188" width="300" height="96" rx="3" fill="#b91c1c" fill-opacity="0.10" stroke="#b91c1c" stroke-width="1.5"/>
  <text class="box" x="574" y="210">system failure</text>
  <text class="mono" x="574" y="228">open / read / write / close failed</text>
  <text class="mono" x="574" y="245">result of this run is untrustworthy</text>
  <text class="mono" x="574" y="262">stop processing, close what opened</text>
  <text class="rc" x="574" y="278">return 1</text>

  <!-- normal ends -->
  <rect x="60" y="312" width="800" height="44" rx="3" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.4"/>
  <text class="box" x="74" y="332">normal end</text>
  <text class="mono" x="74" y="349">status "10" (EOF) and an empty input are neither a rejection nor a failure → 0 records, exit code 0</text>

  <text class="note" x="28" y="384">Why separate them: if every problem printed a line and continued, the exit code would always be 0 —</text>
  <text class="note" x="28" y="404">and the scheduler could not tell "some records were rejected" from "the input file never arrived".</text>
</svg>
