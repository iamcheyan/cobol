<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img" aria-labelledby="title desc" font-family="'DM Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif">
  <title id="title">SORT moves records through input, ordering, and output stages</title>
  <desc id="desc">The INPUT PROCEDURE reads 27-character account records and RELEASEs them to SORT-WORK. SORT orders them ascending by SD-ACCOUNT-NUMBER. The OUTPUT PROCEDURE RETURNs sorted records one at a time; SORT-RETURN and input/output counts are checked.</desc>
  <style>
    .h { font-size: 17px; font-weight: 600; fill: #3f3b3b; }
    .label { font-size: 13px; font-weight: 600; fill: #3f3b3b; }
    .code { font-size: 11.5px; fill: #3f3b3b; font-family: 'DM Mono',ui-monospace,monospace; }
    .small { font-size: 11.5px; fill: #5f5b52; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="348" rx="10" fill="#fcfbf7" stroke="#d8d2c3"/>
  <text class="h" x="32" y="38">SORT 流水线 · 账户编号升序</text>
  <rect x="28" y="86" width="224" height="152" rx="4" fill="#64748b" fill-opacity="0.14" stroke="#64748b" stroke-width="1.5"/>
  <text class="label" x="140" y="114" text-anchor="middle">输入过程</text>
  <text class="code" x="140" y="144" text-anchor="middle">1000-LOAD-INPUT</text>
  <text class="small" x="140" y="174" text-anchor="middle">READ 输入记录</text>
  <text class="code" x="140" y="198" text-anchor="middle">RELEASE SD-SORT-RECORD</text>
  <text class="small" x="140" y="222" text-anchor="middle">27 字符 · X(10)+X(8)+9(7)V99</text>
  <path d="M252 162H326" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="code" x="289" y="146" text-anchor="middle">RELEASE</text>
  <rect x="330" y="86" width="240" height="152" rx="4" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-width="1.5"/>
  <text class="label" x="450" y="114" text-anchor="middle">SORT-WORK · SD</text>
  <text class="code" x="450" y="145" text-anchor="middle">SORT ... ON ASCENDING KEY</text>
  <text class="code" x="450" y="168" text-anchor="middle">SD-ACCOUNT-NUMBER</text>
  <path d="M375 199H525" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#blueArrow)"/>
  <text class="small" x="450" y="223" text-anchor="middle">运行时会为已 RELEASE 的记录排序</text>
  <path d="M570 162H644" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="code" x="607" y="146" text-anchor="middle">RETURN</text>
  <rect x="648" y="86" width="224" height="152" rx="4" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.5"/>
  <text class="label" x="760" y="114" text-anchor="middle">输出过程</text>
  <text class="code" x="760" y="144" text-anchor="middle">2000-RETURN-SORTED</text>
  <text class="small" x="760" y="174" text-anchor="middle">RETURN 一条已排序记录</text>
  <text class="small" x="760" y="198" text-anchor="middle">处理直到 AT END</text>
  <text class="small" x="760" y="222" text-anchor="middle">有序流 · 无输出文件</text>
  <rect x="28" y="266" width="844" height="70" rx="4" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.5"/>
  <text class="label" x="50" y="290">控制</text>
  <text class="small" x="140" y="290">SORT-RETURN = ZERO · 输入数 = 输出数</text>
  <text class="small" x="140" y="310">本课夹具：RELEASE 4 条、RETURN 4 条。</text>
  <text class="small" x="140" y="328">工作文件由 SORT 管理，应用代码不 OPEN/CLOSE 它。</text>
</svg>
