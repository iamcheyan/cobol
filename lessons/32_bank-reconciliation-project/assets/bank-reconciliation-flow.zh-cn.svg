<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 625" role="img" aria-labelledby="title desc" font-family="'DM Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif">
  <title id="title">Bank reconciliation batch: data flow and handoff</title>
  <desc id="desc">Account and transaction files are loaded and validated, transactions are matched against the in-memory account master and posted or rejected. When file processing succeeds, computed accounts are synchronized with the database snapshot. Reports, batch log, count checks, and return status complete the run.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0d9488"/></marker>
  </defs>
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #3f3b3b; }
    .subtitle { font-size: 12px; fill: #5f5b52; }
    .head { font-size: 13px; font-weight: 700; fill: #3f3b3b; }
    .label { font-size: 11.5px; fill: #3f3b3b; }
    .mono { font-size: 11px; fill: #3f3b3b; font-family: 'DM Mono',ui-monospace,monospace; }
    .note { font-size: 11px; fill: #5f5b52; }
    .card { fill: #fcfbf7; stroke: #d8d2c3; stroke-width: 1.5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
    .main-flow { fill: none; stroke: #2563eb; stroke-width: 1.8; marker-end: url(#blue-arrow); }
    .data-flow { fill: none; stroke: #0d9488; stroke-width: 1.8; marker-end: url(#teal-arrow); }
  </style>
  <rect x="1" y="1" width="918" height="623" rx="10" fill="#fcfbf7" stroke="#d8d2c3"/>
  <text class="title" x="28" y="34">银行对账批处理</text>
  <text class="subtitle" x="28" y="55">文件入账后进入受保护的数据库同步；每笔交易都会入账或拒绝。</text>

  <!-- connectors are behind cards -->
  <path class="flow" d="M205 125 H245"/>
  <path class="flow" d="M205 217 H225 V164 H245"/>
  <path class="main-flow" d="M445 145 V190"/>
  <path class="data-flow" d="M555 252 H600 V226 H625"/>
  <path class="flow" d="M555 278 H600 V310 H625"/>
  <path class="main-flow" d="M445 314 V365"/>
  <path class="flow" d="M205 425 H245"/>
  <path class="data-flow" d="M555 405 H625"/>
  <path class="flow" d="M555 433 H600 V490 H625"/>
  <path class="flow" d="M345 460 V500"/>
  <path class="flow" d="M445 460 V500"/>

  <!-- inputs -->
  <rect class="card" x="25" y="91" width="180" height="68" rx="4"/>
  <rect x="25" y="91" width="5" height="68" fill="#64748b"/>
  <text class="head" x="42" y="116">账户主档</text>
  <text class="mono" x="42" y="138">accounts.txt</text>

  <rect class="card" x="25" y="183" width="180" height="68" rx="4"/>
  <rect x="25" y="183" width="5" height="68" fill="#64748b"/>
  <text class="head" x="42" y="208">每日交易</text>
  <text class="mono" x="42" y="230">transactions.txt</text>

  <rect class="card" x="25" y="391" width="180" height="68" rx="4"/>
  <rect x="25" y="391" width="5" height="68" fill="#64748b"/>
  <text class="head" x="42" y="416">数据库快照</text>
  <text class="mono" x="42" y="438">ACCOUNT_SNAPSHOT</text>

  <!-- processing -->
  <rect class="card" x="245" y="91" width="310" height="108" rx="4"/>
  <rect x="245" y="91" width="5" height="108" fill="#d97706"/>
  <text class="head" x="264" y="116">打开文件并加载账户</text>
  <text class="mono" x="264" y="139">1000-OPEN-FILES</text>
  <text class="mono" x="264" y="158">1100-LOAD-ACCOUNTS</text>
  <text class="note" x="264" y="180">验证余额为数字、容量足够且键唯一</text>

  <rect class="card" x="245" y="215" width="310" height="110" rx="4"/>
  <rect x="245" y="215" width="5" height="110" fill="#2563eb"/>
  <text class="head" x="264" y="240">验证、匹配并入账</text>
  <text class="mono" x="264" y="262">2000-POST-TRANSACTIONS · 2100-POST-ONE</text>
  <text class="mono" x="264" y="282">2200-APPLY-TRANSACTION</text>
  <text class="note" x="264" y="305">匹配账户；按 D / C 规则处理或拒绝</text>

  <rect class="card" x="245" y="365" width="310" height="95" rx="4"/>
  <rect x="245" y="365" width="5" height="95" fill="#0d9488"/>
  <text class="head" x="264" y="390">同步账户表</text>
  <text class="mono" x="264" y="412">2000-SYNC-TABLE · 2100-SYNC-ACCOUNT</text>
  <text class="note" x="264" y="438">仅当文件处理无系统错误时运行</text>

  <!-- outputs -->
  <rect class="card" x="625" y="190" width="265" height="70" rx="4"/>
  <rect x="625" y="190" width="5" height="70" fill="#0d9488"/>
  <text class="head" x="644" y="216">已入账</text>
  <text class="mono" x="644" y="239">2300-WRITE-POSTED → accepted.txt</text>

  <rect class="card" x="625" y="276" width="265" height="70" rx="4"/>
  <rect x="625" y="276" width="5" height="70" fill="#b91c1c"/>
  <text class="head" x="644" y="302">业务拒绝</text>
  <text class="mono" x="644" y="325">2400-WRITE-REJECTED → rejected.txt</text>

  <rect class="card" x="625" y="365" width="265" height="76" rx="4"/>
  <rect x="625" y="365" width="5" height="76" fill="#0d9488"/>
  <text class="head" x="644" y="389">快照比较</text>
  <text class="mono" x="644" y="410">2200-UPDATE · UNCHANGED</text>
  <text class="mono" x="644" y="429">2300-INSERT · 2400-REPORT-SYNC</text>

  <rect class="card" x="625" y="465" width="265" height="62" rx="4"/>
  <rect x="625" y="465" width="5" height="62" fill="#64748b"/>
  <text class="head" x="644" y="489">审计与对账输出</text>
  <text class="mono" x="644" y="512">batch.log · account-report.txt</text>

  <!-- run controls -->
  <rect class="card" x="245" y="500" width="310" height="82" rx="4"/>
  <rect x="245" y="500" width="5" height="82" fill="#d97706"/>
  <text class="head" x="264" y="522">3000-CHECK-COUNTS</text>
  <text class="label" x="264" y="542">已过账 + 已拒绝 = 交易数</text>
  <text class="label" x="264" y="559">已更新 + 未变 + 已插入 = 账户数</text>
  <text class="mono" x="264" y="576">2000-RETURN-STATUS · RETURN-CODE 0 / 1</text>
  <text class="note" x="28" y="605">系统故障会设置非零返回码；业务拒绝仍作为已计数结果处理。</text>
</svg>
