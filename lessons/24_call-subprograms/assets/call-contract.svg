<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t d" font-family="'DM Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif">
  <title id="t">CALL passes parameters by position, not by name</title>
  <desc id="d">The caller passes WS-AMOUNT and WS-CHECK-RESULT in order; the subprogram receives them as LK-AMOUNT and LK-CHECK-RESULT. The amount is read-only input, the status is written back.</desc>
  <style>
    .h1{font-size:16px;font-weight:600;fill:#3f3b3b}.sub{font-size:12px;fill:#5f5b52}
    .box{font-size:11.5px;font-weight:600;fill:#3f3b3b}.mono{font-size:10.5px;fill:#3f3b3b;font-family:'DM Mono',ui-monospace,monospace}
    .note{font-size:11px;fill:#5f5b52}.lbl{font-size:10.5px;fill:#77736c;font-family:'DM Mono',ui-monospace,monospace}
  </style>
  <rect x="1" y="1" width="918" height="398" rx="10" fill="#fcfbf7" stroke="#d8d2c3"/>
  <text class="h1" x="28" y="34">Position decides the parameter, not the name</text>
  <text class="sub" x="28" y="54">Two fields, in this order. Renaming a field changes nothing; swapping the order breaks the contract.</text>
  <defs><marker id="m" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
        <marker id="mb" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#b91c1c"/></marker></defs>

  <!-- caller / callee headers -->
  <text class="box" x="150" y="86" text-anchor="middle">CALLER · lesson.cob</text>
  <text class="box" x="700" y="86" text-anchor="middle">CALLEE · amount_check_24.cob</text>

  <!-- program ids -->
  <rect x="60" y="98" width="180" height="40" rx="3" fill="#64748b" fill-opacity="0.14" stroke="#64748b" stroke-width="1.4"/>
  <text class="mono" x="150" y="123" text-anchor="middle">PROGRAM-ID. LESSON24</text>
  <rect x="610" y="98" width="180" height="40" rx="3" fill="#64748b" fill-opacity="0.14" stroke="#64748b" stroke-width="1.4"/>
  <text class="mono" x="700" y="123" text-anchor="middle">PROGRAM-ID. CHECK-AMOUNT</text>

  <!-- position 1 -->
  <rect x="60" y="168" width="180" height="58" rx="3" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-width="1.5"/>
  <text class="mono" x="72" y="188">WS-AMOUNT</text>
  <text class="mono" x="72" y="205">PIC 9(7)V99 · 9 B</text>
  <text class="lbl" x="72" y="220">position 1</text>

  <rect x="610" y="168" width="180" height="58" rx="3" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-width="1.5"/>
  <text class="mono" x="622" y="188">LK-AMOUNT</text>
  <text class="mono" x="622" y="205">PIC 9(7)V99 · 9 B</text>
  <text class="lbl" x="622" y="220">LINKAGE · read only</text>

  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#m)">
    <line x1="244" y1="197" x2="604" y2="197"/>
  </g>
  <text class="note" x="424" y="188" text-anchor="middle">amount in → validated, never modified</text>

  <!-- position 2 -->
  <rect x="60" y="262" width="180" height="58" rx="3" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.5"/>
  <text class="mono" x="72" y="282">WS-CHECK-RESULT</text>
  <text class="mono" x="72" y="299">PIC X(15) · 15 B</text>
  <text class="lbl" x="72" y="314">position 2</text>

  <rect x="610" y="262" width="180" height="58" rx="3" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.5"/>
  <text class="mono" x="622" y="282">LK-CHECK-RESULT</text>
  <text class="mono" x="622" y="299">PIC X(15) · 15 B</text>
  <text class="lbl" x="622" y="314">LINKAGE · written back</text>

  <g stroke="#0d9488" stroke-width="1.4" fill="none" marker-end="url(#m)">
    <line x1="604" y1="291" x2="244" y2="291"/>
  </g>
  <text class="note" x="424" y="282" text-anchor="middle">status written back → caller counts it</text>

  <!-- warning -->
  <rect x="28" y="344" width="862" height="40" rx="3" fill="#b91c1c" fill-opacity="0.10" stroke="#b91c1c" stroke-width="1.4"/>
  <text class="note" x="42" y="369">Order matters: two X(15) fields swapped would compile and run, then write a status into the amount. Keep the Copybook contract in sync.</text>
</svg>
