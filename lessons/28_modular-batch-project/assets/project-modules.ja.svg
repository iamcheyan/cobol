<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-labelledby="t d" font-family="'DM Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif">
  <title id="t">Three programs, four copybooks, one interface each</title>
  <desc id="d">The main program calls the posting module and the report module. Each copybook describes exactly one interface: account record, transaction record, post status and batch counts.</desc>
  <style>
    .h1{font-size:16px;font-weight:600;fill:#3f3b3b}.sub{font-size:12px;fill:#5f5b52}
    .prog{font-size:11.5px;font-weight:600;fill:#3f3b3b}.mono{font-size:10px;fill:#3f3b3b;font-family:'DM Mono',ui-monospace,monospace}
    .cp{font-size:10.5px;fill:#3f3b3b;font-family:'DM Mono',ui-monospace,monospace}.note{font-size:11px;fill:#5f5b52}
    .tag{font-size:10px;fill:#77736c;font-family:'DM Mono',ui-monospace,monospace}
  </style>
  <rect x="1" y="1" width="938" height="468" rx="10" fill="#fcfbf7" stroke="#d8d2c3"/>
  <text class="h1" x="28" y="34">3つのプログラム、4つのCopybook</text>
  <text class="sub" x="28" y="54">Copybookは1つにつき1つのインターフェース。必要なものだけCOPYするので、変更の影響範囲が見える。</text>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker></defs>

  <!-- programs -->
  <rect x="40" y="76" width="230" height="88" rx="3" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-width="1.5"/>
  <text class="prog" x="54" y="97">lesson.cob</text>
  <text class="mono" x="54" y="115">メイン：ログ、サンプル、CALL</text>
  <text class="mono" x="54" y="132">状態を集計し、ログを書く</text>
  <text class="tag" x="54" y="152">PROGRAM-ID. LESSON28</text>

  <rect x="340" y="76" width="230" height="88" rx="3" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.5"/>
  <text class="prog" x="354" y="97">post_transaction_28.cob</text>
  <text class="mono" x="354" y="115">口座と種別を検証</text>
  <text class="mono" x="354" y="132">呼出元の残高を更新</text>
  <text class="tag" x="354" y="152">POST-TRANSACTION28</text>

  <rect x="640" y="76" width="250" height="88" rx="3" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.5"/>
  <text class="prog" x="654" y="97">report_account_28.cob</text>
  <text class="mono" x="654" y="115">最終口座と件数を読む</text>
  <text class="mono" x="654" y="132">バッチ要約を表示</text>
  <text class="tag" x="654" y="152">REPORT-ACCOUNT28</text>

  <g stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <line x1="272" y1="120" x2="336" y2="120"/>
    <line x1="572" y1="120" x2="636" y2="120"/>
  </g>
  <text class="note" x="304" y="112" text-anchor="middle">CALL</text>
  <text class="note" x="604" y="112" text-anchor="middle">CALL</text>

  <!-- copybooks -->
  <text class="note" x="40" y="204">インターフェースは copybooks/ に、1ファイル1形：</text>

  <rect x="40" y="216" width="205" height="66" rx="3" fill="#64748b" fill-opacity="0.14" stroke="#64748b" stroke-width="1.4"/>
  <text class="cp" x="52" y="236">ACCOUNT-REC.CPY</text>
  <text class="mono" x="52" y="253">X(10)+X(8)+9(7)V99</text>
  <text class="mono" x="52" y="269">27 バイト</text>

  <rect x="262" y="216" width="205" height="66" rx="3" fill="#64748b" fill-opacity="0.14" stroke="#64748b" stroke-width="1.4"/>
  <text class="cp" x="274" y="236">TRANSACTION-REC.CPY</text>
  <text class="mono" x="274" y="253">X(10)+X(1)+9(7)V99</text>
  <text class="mono" x="274" y="269">20 バイト</text>

  <rect x="484" y="216" width="205" height="66" rx="3" fill="#64748b" fill-opacity="0.14" stroke="#64748b" stroke-width="1.4"/>
  <text class="cp" x="496" y="236">POST-STATUS.CPY</text>
  <text class="mono" x="496" y="253">X(12): POSTED, INSUFFICIENT,</text>
  <text class="mono" x="496" y="269">BAD_TYPE, NO_ACCOUNT</text>

  <rect x="706" y="216" width="184" height="66" rx="3" fill="#64748b" fill-opacity="0.14" stroke="#64748b" stroke-width="1.4"/>
  <text class="cp" x="718" y="236">BATCH-COUNTS.CPY</text>
  <text class="mono" x="718" y="253">POSTED-COUNT 9(3)</text>
  <text class="mono" x="718" y="269">REJECTED-COUNT 9(3)</text>

  <!-- who copies what -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="142" y1="216" x2="142" y2="168"/>
    <line x1="364" y1="216" x2="364" y2="168"/>
    <line x1="586" y1="216" x2="586" y2="168"/>
    <line x1="798" y1="216" x2="798" y2="168"/>
  </g>
  <text class="tag" x="40" y="304">誰が何をCOPY：口座→メイン,入帳,報告 · 取引→メイン,入帳 · 状態→メイン,入帳 · 件数→メイン,報告</text>

  <!-- five transactions -->
  <rect x="40" y="322" width="850" height="120" rx="3" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.4"/>
  <text class="prog" x="54" y="343">初期残高 1000.00 に対するサンプル取引5件</text>
  <text class="mono" x="54" y="364">1  D  125.50   POSTED        → 1125.50</text>
  <text class="mono" x="54" y="381">2  C   25.25   POSTED        → 1100.25</text>
  <text class="mono" x="54" y="398">3  C 2000.00   INSUFFICIENT  → 残高は不変</text>
  <text class="mono" x="54" y="415">4  X    1.00   BAD_TYPE      → 残高は不変</text>
  <text class="mono" x="54" y="432">5  D    1.00   NO_ACCOUNT    → 口座が不一致</text>
  <text class="note" x="470" y="364">件数の不変条件：POSTED + REJECTED = 5、ここでは 2 + 3 = 5</text>
  <text class="note" x="470" y="381">手計算：1000.00 + 125.50 − 25.25 = 1100.25</text>
</svg>
