<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc" font-family="'DM Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif">
  <title id="title">Three CALL USING data directions</title>
  <desc id="desc">BY REFERENCE gives the subprogram the caller storage and allows a change to flow back. BY CONTENT sends a temporary copy whose changes do not return. BY VALUE sends the numeric value to a read-only subprogram.</desc>
  <style>
    .title { font-size: 16px; font-weight: 600; fill: #3f3b3b; }
    .label { font-size: 12px; font-weight: 600; fill: #3f3b3b; }
    .mode { font-size: 13px; font-weight: 600; fill: #2563eb; font-family: 'DM Mono',ui-monospace,monospace; }
    .text { font-size: 12px; fill: #5f5b52; }
    .value { font-size: 12px; font-weight: 600; fill: #3f3b3b; font-family: 'DM Mono',ui-monospace,monospace; }
  </style>
  <defs>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0d9488"/></marker>
    <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="428" rx="10" fill="#fcfbf7" stroke="#d8d2c3" stroke-width="1.5"/>
  <text class="title" x="36" y="40">CALL ... USING：数据变更会传到哪里？</text>
  <text class="label" x="230" y="74" text-anchor="middle">调用方</text>
  <text class="label" x="670" y="74" text-anchor="middle">子程序</text>

  <rect x="36" y="91" width="828" height="96" rx="4" fill="#fcfbf7" stroke="#d8d2c3" stroke-width="1.5"/>
  <text class="mode" x="54" y="117">按引用</text>
  <rect x="104" y="134" width="250" height="36" rx="4" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="546" y="134" width="250" height="36" rx="4" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.5"/>
  <text class="value" x="229" y="157" text-anchor="middle">AMOUNT = 10</text>
  <text class="value" x="671" y="157" text-anchor="middle">相同存储区</text>
  <path d="M363 143 H535" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#blue-arrow)"/>
  <path d="M535 162 H363" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#teal-arrow)"/>
  <text class="text" x="450" y="132" text-anchor="middle">地址</text>
  <text class="text" x="450" y="181" text-anchor="middle">写回：调用方看到 11</text>

  <rect x="36" y="198" width="828" height="96" rx="4" fill="#fcfbf7" stroke="#d8d2c3" stroke-width="1.5"/>
  <text class="mode" x="54" y="224">按内容</text>
  <rect x="104" y="241" width="250" height="36" rx="4" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="546" y="241" width="250" height="36" rx="4" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.5"/>
  <text class="value" x="229" y="264" text-anchor="middle">AMOUNT = 20</text>
  <text class="value" x="671" y="264" text-anchor="middle">副本：20 → 21</text>
  <path d="M363 259 H535" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#blue-arrow)"/>
  <path d="M535 281 H363" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#gray-arrow)"/>
  <text class="text" x="450" y="239" text-anchor="middle">内容</text>
  <text class="text" x="250" y="289" text-anchor="middle">丢弃副本：调用方仍为 20</text>

  <rect x="36" y="305" width="828" height="96" rx="4" fill="#fcfbf7" stroke="#d8d2c3" stroke-width="1.5"/>
  <text class="mode" x="54" y="331">按值</text>
  <rect x="104" y="348" width="250" height="36" rx="4" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="546" y="348" width="250" height="36" rx="4" fill="#64748b" fill-opacity="0.12" stroke="#64748b" stroke-width="1.5"/>
  <text class="value" x="229" y="371" text-anchor="middle">AMOUNT = 30</text>
  <text class="value" x="671" y="371" text-anchor="middle">值：30（只读）</text>
  <path d="M363 366 H535" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#blue-arrow)"/>
  <text class="text" x="450" y="346" text-anchor="middle">数值</text>
  <text class="text" x="450" y="396" text-anchor="middle">不写回：调用方仍为 30</text>
</svg>
