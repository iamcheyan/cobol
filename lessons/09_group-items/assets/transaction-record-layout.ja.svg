<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc" font-family="'DM Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif">
  <title id="title">58-byte transaction record hierarchy and offsets</title>
  <desc id="desc">The 01 root contains customer, account, and transaction groups. Eight elementary fields occupy contiguous byte ranges from 1 through 58.</desc>
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #3f3b3b; }
    .label { font-size: 12px; font-weight: 600; fill: #3f3b3b; }
    .field { font-size: 11px; font-weight: 600; fill: #3f3b3b; font-family: 'DM Mono',ui-monospace,monospace; }
    .pic { font-size: 11px; fill: #5f5b52; font-family: 'DM Mono',ui-monospace,monospace; }
    .off { font-size: 11px; fill: #5f5b52; font-family: 'DM Mono',ui-monospace,monospace; }
    .total { font-size: 13px; font-weight: 600; fill: #2563eb; }
  </style>
  <rect x="1" y="1" width="978" height="558" rx="10" fill="#fcfbf7" stroke="#d8d2c3" stroke-width="1.5"/>
  <text class="title" x="30" y="36">WS-TRANSACTION-RECORD · 58 バイト</text>
  <text class="label" x="30" y="73">01</text><text class="field" x="62" y="73">WS-TRANSACTION-RECORD</text>
  <rect x="30" y="88" width="920" height="54" rx="4" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="32" y="90" width="315" height="50" rx="3" fill="#0d9488" fill-opacity="0.12" stroke="#0d9488" stroke-width="1.5"/><rect x="350" y="90" width="175" height="50" rx="3" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.5"/><rect x="528" y="90" width="420" height="50" rx="3" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
  <text class="label" x="190" y="111" text-anchor="middle">05 WS-CUSTOMER-INFO</text><text class="off" x="190" y="130" text-anchor="middle">20 バイト · 1–20</text><text class="label" x="438" y="111" text-anchor="middle">05 WS-ACCOUNT-INFO</text><text class="off" x="438" y="130" text-anchor="middle">11 バイト · 21–31</text><text class="label" x="738" y="111" text-anchor="middle">05 WS-TXN-INFO</text><text class="off" x="738" y="130" text-anchor="middle">27 バイト · 32–58</text>
  <text class="label" x="30" y="177">10個の基本項目 · 宣言順 · 1始まりのバイト範囲</text>
  <g class="off" text-anchor="middle"><text x="500" y="207">1</text><text x="562" y="207">9</text><text x="655" y="207">21</text><text x="733" y="207">31</text><text x="741" y="207">32</text><text x="834" y="207">44</text><text x="841" y="207">45</text><text x="895" y="207">52</text><text x="950" y="207">59</text></g>
  <g stroke="#d8d2c3" stroke-width="1"><path d="M500 211V516 M562 211V516 M655 211V516 M733 211V516 M741 211V516 M834 211V516 M841 211V516 M895 211V516 M950 211V516"/></g>
  <g>
    <text class="field" x="30" y="240">WS-CUSTOMER-ID</text><text class="pic" x="295" y="240">X(8) · 8 バイト</text><rect x="500" y="222" width="62" height="26" rx="3" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.5"/><text class="off" x="531" y="268" text-anchor="middle">1–8</text>
    <text class="field" x="30" y="276">WS-CUSTOMER-NAME</text><text class="pic" x="295" y="276">X(12) · 12 バイト</text><rect x="562" y="258" width="93" height="26" rx="3" fill="#0d9488" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.5"/><text class="off" x="608" y="304" text-anchor="middle">9–20</text>
    <text class="field" x="30" y="312">WS-ACCOUNT-NUMBER</text><text class="pic" x="295" y="312">X(10) · 10 バイト</text><rect x="655" y="294" width="78" height="26" rx="3" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.5"/><text class="off" x="694" y="340" text-anchor="middle">21–30</text>
    <text class="field" x="30" y="348">WS-STATUS OF WS-ACCOUNT-INFO</text><text class="pic" x="295" y="348">X · 1 バイト</text><rect x="733" y="330" width="8" height="26" rx="2" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="1.5"/><text class="off" x="737" y="376" text-anchor="middle">31</text>
    <text class="field" x="30" y="384">WS-TXN-ID</text><text class="pic" x="295" y="384">X(12) · 12 バイト</text><rect x="741" y="366" width="93" height="26" rx="3" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="1.5"/><text class="off" x="787" y="412" text-anchor="middle">32–43</text>
    <text class="field" x="30" y="420">WS-TXN-CODE</text><text class="pic" x="295" y="420">X · 1 バイト</text><rect x="834" y="402" width="7" height="26" rx="2" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="1.5"/><text class="off" x="838" y="448" text-anchor="middle">44</text>
    <text class="field" x="30" y="456">WS-TXN-AMOUNT</text><text class="pic" x="295" y="456">9(5)V99 · 7 バイト</text><rect x="841" y="438" width="54" height="26" rx="3" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="1.5"/><text class="off" x="868" y="484" text-anchor="middle">45–51</text>
    <text class="field" x="30" y="492">WS-STATUS OF WS-TXN-INFO</text><text class="pic" x="295" y="492">X(7) · 7 バイト</text><rect x="895" y="474" width="55" height="26" rx="3" fill="#64748b" fill-opacity="0.18" stroke="#64748b" stroke-width="1.5"/><text class="off" x="922" y="520" text-anchor="middle">52–58</text>
  </g>
  <text class="total" x="950" y="545" text-anchor="end">20 + 11 + 27 = 58 バイト</text>
</svg>
