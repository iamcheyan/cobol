<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc" font-family="'DM Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif">
  <title id="title">SEARCH and SEARCH ALL on the four account entries</title>
  <desc id="desc">Sequential search checks account entries from 1 through 3 to find 0002468101. Binary search checks the middle entry 2, then entry 3, finding the same 520.00 balance. Binary search requires unique keys in the declared ascending order.</desc>
  <style>
    .title { font-size: 16px; font-weight: 600; fill: #3f3b3b; }
    .label { font-size: 13px; font-weight: 600; fill: #3f3b3b; }
    .text { font-size: 12px; fill: #3f3b3b; }
    .mono { font-size: 12px; fill: #3f3b3b; font-family: 'DM Mono',ui-monospace,monospace; }
    .note { font-size: 11px; fill: #5f5b52; }
    .arrow { fill: none; stroke: #2563eb; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="428" rx="10" fill="#fcfbf7" stroke="#d8d2c3" stroke-width="1.5"/>
  <text class="title" x="32" y="36">Same key, two search paths through 4 ascending account entries</text>
  <text class="note" x="32" y="57">Target: 0002468101  ·  match: entry 3  ·  balance: 520.00</text>

  <text class="label" x="32" y="102">SEARCH</text>
  <text class="note" x="32" y="121">Sequential</text>
  <g>
    <rect x="180" y="78" width="150" height="58" rx="4" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.5"/>
    <rect x="345" y="78" width="150" height="58" rx="4" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.5"/>
    <rect x="510" y="78" width="150" height="58" rx="4" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="675" y="78" width="150" height="58" rx="4" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.5"/>
    <text class="note" x="255" y="98" text-anchor="middle">ENTRY 1</text><text class="mono" x="255" y="120" text-anchor="middle">0000000042</text>
    <text class="note" x="420" y="98" text-anchor="middle">ENTRY 2</text><text class="mono" x="420" y="120" text-anchor="middle">0001234567</text>
    <text class="note" x="585" y="98" text-anchor="middle">ENTRY 3 · MATCH</text><text class="mono" x="585" y="120" text-anchor="middle">0002468101</text>
    <text class="note" x="750" y="98" text-anchor="middle">ENTRY 4</text><text class="mono" x="750" y="120" text-anchor="middle">0007654321</text>
  </g>
  <path class="arrow" d="M255 147 H420"/><path class="arrow" d="M420 147 H585"/>
  <text class="text" x="180" y="174">Start at index 1; compare each entry in order until the key matches.</text>

  <line x1="32" y1="197" x2="868" y2="197" stroke="#d8d2c3" stroke-width="1.2"/>
  <text class="label" x="32" y="230">SEARCH ALL</text>
  <text class="note" x="32" y="249">Binary</text>
  <g>
    <rect x="180" y="209" width="150" height="58" rx="4" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.5"/>
    <rect x="345" y="209" width="150" height="58" rx="4" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.5"/>
    <rect x="510" y="209" width="150" height="58" rx="4" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="675" y="209" width="150" height="58" rx="4" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.5"/>
    <text class="note" x="255" y="229" text-anchor="middle">ENTRY 1</text><text class="mono" x="255" y="251" text-anchor="middle">0000000042</text>
    <text class="note" x="420" y="229" text-anchor="middle">ENTRY 2 · PROBE</text><text class="mono" x="420" y="251" text-anchor="middle">0001234567</text>
    <text class="note" x="585" y="229" text-anchor="middle">ENTRY 3 · MATCH</text><text class="mono" x="585" y="251" text-anchor="middle">0002468101</text>
    <text class="note" x="750" y="229" text-anchor="middle">ENTRY 4</text><text class="mono" x="750" y="251" text-anchor="middle">0007654321</text>
  </g>
  <path class="arrow" d="M420 278 V296 H585 V278"/>
  <text class="text" x="180" y="323">Probe the middle entry (2); target is greater, so continue in the upper half to entry 3.</text>
  <rect x="180" y="345" width="645" height="58" rx="4" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
  <text class="label" x="200" y="369">Precondition</text>
  <text class="text" x="200" y="390">INDEXED BY + unique keys + actual order matches ASCENDING KEY</text>
</svg>
