<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc" font-family="'DM Sans','Noto Sans SC','Noto Sans JP',system-ui,sans-serif">
  <title id="title">Embedded SQL build and runtime pipeline</title>
  <desc id="desc">lesson.cob with embedded SQL is preprocessed by gixpp into lesson_29.cbsql, compiled through a C intermediate by cobc, linked into lesson_29, then run with the SQLite database.</desc>
  <style>
    .h1 { font-size: 18px; font-weight: 600; fill: #3f3b3b; }
    .sub { font-size: 12px; fill: #5f5b52; }
    .label { font-size: 13px; font-weight: 600; fill: #3f3b3b; }
    .mono { font-size: 12px; fill: #3f3b3b; font-family: 'DM Mono',ui-monospace,monospace; }
    .note { font-size: 11px; fill: #5f5b52; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#76319f"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="328" rx="10" fill="#fcfbf7" stroke="#d8d2c3" stroke-width="1.5"/>
  <text class="h1" x="32" y="39">Embedded SQL: source to running program</text>
  <text class="sub" x="32" y="61">Precompile EXEC SQL first; cobc compiles and links the translated COBOL.</text>

  <g stroke="#76319f" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="174" y1="167" x2="202" y2="167"/>
    <line x1="337" y1="167" x2="365" y2="167"/>
    <line x1="500" y1="167" x2="528" y2="167"/>
    <line x1="663" y1="167" x2="691" y2="167"/>
  </g>

  <g>
    <rect x="32" y="102" width="142" height="130" rx="4" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.5"/>
    <text class="label" x="103" y="128" text-anchor="middle">COBOL source</text>
    <text class="mono" x="103" y="158" text-anchor="middle">lesson.cob</text>
    <text class="note" x="103" y="184" text-anchor="middle">EXEC SQL</text>
    <text class="note" x="103" y="201" text-anchor="middle">embedded in source</text>

    <rect x="202" y="102" width="135" height="130" rx="4" fill="#d97706" fill-opacity="0.16" stroke="#d97706" stroke-width="1.5"/>
    <text class="label" x="269.5" y="128" text-anchor="middle">Precompile</text>
    <text class="mono" x="269.5" y="158" text-anchor="middle">gixpp -e</text>
    <text class="note" x="269.5" y="184" text-anchor="middle">translates SQL</text>
    <text class="note" x="269.5" y="201" text-anchor="middle">to COBOL</text>

    <rect x="365" y="102" width="135" height="130" rx="4" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.5"/>
    <text class="label" x="432.5" y="128" text-anchor="middle">Precompile output</text>
    <text class="mono" x="432.5" y="158" text-anchor="middle">lesson_29.cbsql</text>
    <text class="note" x="432.5" y="190" text-anchor="middle">plain COBOL</text>

    <rect x="528" y="102" width="135" height="130" rx="4" fill="#2563eb" fill-opacity="0.16" stroke="#2563eb" stroke-width="1.5"/>
    <text class="label" x="595.5" y="128" text-anchor="middle">Compile / link</text>
    <text class="mono" x="595.5" y="158" text-anchor="middle">cobc</text>
    <text class="note" x="595.5" y="184" text-anchor="middle">C intermediate</text>
    <text class="note" x="595.5" y="201" text-anchor="middle">internal stage</text>

    <rect x="691" y="102" width="177" height="130" rx="4" fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="1.5"/>
    <text class="label" x="779.5" y="128" text-anchor="middle">Executable</text>
    <text class="mono" x="779.5" y="158" text-anchor="middle">build/lesson_29</text>
    <text class="note" x="779.5" y="188" text-anchor="middle">linked with -lgixsql</text>
  </g>

  <line x1="780" y1="232" x2="780" y2="263" stroke="#76319f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="604" y="263" width="264" height="42" rx="4" fill="#64748b" fill-opacity="0.16" stroke="#64748b" stroke-width="1.5"/>
  <text class="mono" x="736" y="289" text-anchor="middle">run → build/accounts.db</text>
  <text class="note" x="32" y="282">Runtime: LD_LIBRARY_PATH locates libgixsql and the SQLite driver.</text>
</svg>
